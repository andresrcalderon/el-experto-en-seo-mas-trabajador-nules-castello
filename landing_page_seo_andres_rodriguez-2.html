<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andres Rodriguez - Experto en SEO en Nules, Castelló</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
</head>
<body class="bg-[#0a0a0c] text-white font-sans h-full overflow-x-hidden selection:bg-neutral-800 selection:text-white">

    <!-- CONTENEDOR PRINCIPAL PANTALLA COMPLETA -->
    <main class="relative min-h-screen w-full flex flex-col justify-between p-8 sm:p-14 lg:p-20 overflow-hidden bg-[#0a0a0c]">
        
        <!-- Fondo negro mate con cuadrícula y vértices grises -->
        <div class="absolute inset-0 z-0 pointer-events-none opacity-40">
            <svg class="w-full h-full" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
                        <!-- Líneas finas de cuadrícula gris -->
                        <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.1" />
                        <!-- Vértices / puntos en los cruces -->
                        <circle cx="0" cy="0" r="1.5" fill="#ffffff" fill-opacity="0.3" />
                    </pattern>
                </defs>
                <rect width="100%" height="100%" fill="url(#grid)" />
            </svg>
        </div>
        
        <!-- Degradado sutil radial central para dar profundidad -->
        <div class="absolute inset-0 z-0 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-neutral-900/40 via-[#0a0a0c] to-[#0a0a0c] pointer-events-none"></div>

        <!-- BARRA SUPERIOR -->
        <div class="relative z-10 flex items-center justify-between w-full">
            <!-- Izquierda: Logo Cubo + Nombre -->
            <div class="flex items-center space-x-4">
                <!-- Icono Cubo Isometrico SVG -->
                <svg class="w-8 h-8 sm:w-9 sm:h-9 text-white" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12.378 1.602a1 1 0 00-.756 0L3.622 5.202A1 1 0 003 6.116v11.768a1 1 0 00.622.914l8 3.6a1 1 0 00.756 0l8-3.6A1 1 0 0021 17.884V6.116a1 1 0 00-.622-.914l-8-3.6zM12 3.692l6.24 2.808L12 9.308 5.76 6.5 12 3.692zM5 8.116l6 2.7v8.492l-6-2.7V8.116zm8 11.192v-8.492l6-2.7v8.492l-6 2.7z" />
                </svg>
                <span class="text-xl sm:text-2xl font-semibold tracking-tight text-neutral-200">Andres Rodriguez</span>
            </div>

            <!-- Derecha: Ubicación -->
            <div class="text-base sm:text-xl font-medium tracking-wide text-neutral-300">
                Nules,Castellò
            </div>
        </div>

        <!-- CONTENIDO PRINCIPAL (TITULAR + SUBTITULAR) -->
        <div class="relative z-10 max-w-4xl my-auto py-12 sm:py-20">
            <!-- Titular Grande -->
            <h1 class="text-4xl sm:text-6xl md:text-7xl lg:text-7xl font-bold tracking-tight text-white leading-[1.08] mb-8">
                El experto en SEO más trabajador de Nules, Castelló
            </h1>

            <!-- Subtitular -->
            <p class="text-xl sm:text-2xl md:text-3xl font-medium text-neutral-400 tracking-wide">
                Experiencia. Compromiso. Valor.
            </p>
        </div>

        <!-- Espaciador inferior para mantener balance visual -->
        <div class="relative z-10 w-full"></div>
    </main>

</body>
</html>
